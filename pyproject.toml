[project]
name = "blender-mcp-bridge"
version = "0.1.3"
description = "An MCP server that gives AI agents hands-on control of Blender: modelling, materials, rendering, and 3D-print checks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "seehiong" }]
keywords = ["mcp", "blender", "3d", "3d-printing", "ai-agent", "n8n", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",  # 2.0 removed the @server.list_tools/@call_tool decorators
    "starlette>=0.27.0",
    "uvicorn>=0.23.0",
    "sse-starlette>=1.6.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.7",
    "httpx>=0.27.0",
    "anthropic>=0.50.0",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/seehiong/blender-mcp-bridge"
Repository = "https://github.com/seehiong/blender-mcp-bridge"
Issues = "https://github.com/seehiong/blender-mcp-bridge/issues"

# `uvx blender-mcp-bridge serve` is the whole install story for a new user.
[project.scripts]
blender-mcp-bridge = "blender_mcp_bridge.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship the server package and the design-rule data it serves. Everything else --
# community projects, Studio sources, tests -- stays in the repo.
packages = ["blender_mcp_bridge"]

[tool.hatch.build.targets.sdist]
include = ["blender_mcp_bridge", "data/design-rules.json", "README.md", "LICENSE"]

# ── Dev dependencies (used in CI and local development) ──────────────────────
[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest>=8.0",
]

# ── Ruff: linting + formatting + complexity ───────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined names, unused imports)
    "W",    # pycodestyle warnings
    "C90",  # mccabe cyclomatic complexity
    "I",    # isort (import ordering)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modernise Python syntax)
    "B",    # flake8-bugbear (likely bugs & design issues)
]
ignore = [
    "E501",  # line too long — handled by formatter (line-length above)
]

[tool.ruff.lint.mccabe]
# Flag any function with cyclomatic complexity above 12.
# Blender server.py dispatch functions are intentionally higher; use
# # noqa: C901 inline for those specific cases.
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# blender_mcp_addon uses Blender's mandatory naming conventions (bl_info,
# register/unregister, UPPER_CASE class names for operators, etc.)
# Suppress all naming-convention and complexity warnings inside the addon.
"blender_mcp_addon/**" = ["N", "C901"]
# Test scenarios use expressive variable names and run/verify functions; relax naming and complexity.
"tests/**" = ["N", "C901"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy: static type checking (src/ only — bpy has no public stubs) ─────────
[tool.mypy]
python_version = "3.10"
# bpy, mcp internals, and some starlette generics lack stubs — silence them.
ignore_missing_imports = true
# Start with a relaxed baseline; tighten gradually as annotations are added.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false


name: Dependency Audit

on:
  # Only when the dependencies themselves change. A schedule would re-audit an
  # unchanged tree and fail on newly published CVEs, which reads as a broken
  # build on a repo nobody has touched.
  push:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
  # Still runnable on demand from the Actions tab.
  workflow_dispatch:

jobs:
  audit:
    name: "pip-audit (CVE scan)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: "Export requirements for audit"
        # pip-audit works best against a flat requirements list
        run: uv export --no-dev --format requirements-txt > /tmp/requirements.txt

      - name: "Run pip-audit"
        run: uvx pip-audit -r /tmp/requirements.txt

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blender MCP - Session Editor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body class="dark-theme" spellcheck="false">
    <div class="app-container">
        <header>
            <div class="logo-section">
                <h1>Session<span>Editor</span></h1>
                <p class="subtitle">Blender MCP Recording Editor</p>
            </div>
            <div class="actions">
                <div id="connectionStatus" class="status-indicator" title="Server Connection Status">
                    <span class="dot"></span> <span class="status-text">Disconnected</span>
                </div>
                <button id="themeToggle" class="btn btn-secondary">Theme</button>
                <input type="file" id="fileInput" accept=".json" hidden>
                <button id="newSessionBtn" class="btn btn-secondary">New Session</button>
                <button id="loadBtn" class="btn btn-primary">Load Session</button>
                <button id="addCommandBtn" class="btn btn-success">+ New Command</button>
                <button id="saveBtn" class="btn btn-secondary" disabled>Export JSON</button>
            </div>
        </header>

        <main>
            <div class="left-sidebar">
                <section id="metadataSection" class="card glass metadata-collapsible">
                <div class="metadata-header" id="metadataToggle" title="Toggle session details">
                    <h2>Session Metadata</h2>
                    <span class="metadata-chevron">▼</span>
                </div>
                <div class="metadata-body" id="metadataBody">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="sessionName">Name</label>
                            <input type="text" id="sessionName" placeholder="Session Name" spellcheck="false">
                        </div>
                        <div class="form-group">
                            <label for="sessionModel">AI Model</label>
                            <input type="text" id="sessionModel" placeholder="e.g. GPT-4o, Claude 3.5 Sonnet"
                                spellcheck="false">
                        </div>
                        <div class="form-group">
                            <label for="sessionCreatedAt">Created At</label>
                            <input type="text" id="sessionCreatedAt" readonly>
                        </div>
                        <div class="form-group full-width">
                            <label for="sessionDescription">Description</label>
                            <textarea id="sessionDescription" placeholder="Describe this recording..."
                                spellcheck="false" style="min-height: 150px; resize: vertical;"></textarea>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Session Playback Controls -->
            <section id="playbackSection" class="card glass playback-collapsible">
                <div class="playback-header" id="playbackToggle" title="Toggle playback controls">
                    <h2>Session Playback</h2>
                    <span class="playback-chevron">▼</span>
                </div>
                <div class="playback-body" id="playbackBody">
                    <div class="playback-controls-container">
                        <div class="control-group main-controls">
                            <button id="undoBtn" class="btn btn-secondary" title="Undo Last Command (Ctrl+Z)">↶ Undo</button>
                            <button id="redoBtn" class="btn btn-secondary" title="Redo Last Command (Ctrl+Y)">↷ Redo</button>
                            <div class="vr"></div>
                            <button id="playAllBtn" class="btn btn-success" disabled title="Play All Commands (Space)">▶ Play All</button>
                            <button id="playBtn" class="btn btn-success" disabled title="Play from Active (Ctrl+Enter)">▶ Play</button>
                            <button id="playToActiveBtn" class="btn btn-success" disabled title="Play up to Active Command">▶ Play to Active</button>
                            <button id="stopBtn" class="btn btn-danger" disabled title="Stop Playback (Esc)">⏹ Stop</button>
                        </div>
                        <div class="control-group secondary-controls">
                            <button id="resetStateBtn" class="btn btn-secondary btn-sm" title="Re-enable all Run buttons (Alt+R)">↺ Reset</button>
                            <button id="clearSceneBtn" class="btn btn-danger btn-sm" title="Delete all objects in Blender scene">🗑 Clear</button>
                        </div>
                        <div class="playback-delay-group">
                            <label for="playbackDelay">Delay (ms)</label>
                            <input type="number" id="playbackDelay" value="500" min="0" step="100" spellcheck="false">
                        </div>
                    </div>
                </div>
            </section>
            </div>

            <section id="commandsSection" class="card glass commands-collapsible">
                <div class="commands-header" id="commandsToggle" title="Toggle commands list">
                    <div class="commands-header-left">
                        <h2>Commands <span id="commandCount" class="badge">0</span></h2>
                    </div>
                    <span class="commands-chevron">▼</span>
                </div>
                <div class="commands-body" id="commandsBody">
                    <!-- Search bar for filtering commands -->
                    <div class="search-bar-container">
                        <input type="text" id="commandFilter" placeholder="Filter tools..." spellcheck="false" class="search-bar">
                    </div>

                    <div id="commandList" class="command-list">
                        <div class="empty-state">
                            <p>No session loaded. Start by clicking "Load Session".</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>Blender MCP &bull; n8n Powered</p>
        </footer>
    </div>

    <!-- Template for Command Item -->
    <template id="commandTemplate">
        <div class="command-card glass accordion-item">
            <div class="command-header accordion-header">
                <div class="command-info">
                    <span class="index">#1</span>
                    <span class="tool-name">create_cube</span>
                    <span class="timestamp">12:34:56</span>
                </div>
                <div class="command-actions">
                    <button class="btn btn-sm btn-run run-cmd" title="Execute in Blender (Alt+Enter)">▶ Run</button>
                    <button class="btn-icon edit-cmd" title="Edit Parameters">⚙️</button>
                    <button class="btn-icon move-up" title="Move up">↑</button>
                    <button class="btn-icon move-down" title="Move down">↓</button>
                    <button class="btn-icon delete-cmd" title="Remove command">×</button>
                    <span class="accordion-icon">▼</span>
                </div>
            </div>
            <div class="command-body accordion-content">
                <div class="command-description-section">
                    <label>Description / Reasoning</label>
                    <textarea class="cmd-description auto-expand" placeholder="Why was this tool called?"
                        spellcheck="false"></textarea>
                </div>
                <div class="editor-container">
                    <label>Arguments (JSON)</label>
                    <div class="args-editor-wrapper">
                        <textarea class="args-editor auto-expand" spellcheck="false"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Custom Modal Component -->
    <div id="modalOverlay" class="modal-overlay" hidden>
        <div class="modal card glass">
            <div class="modal-header">
                <h3 id="modalTitle"></h3>
                <button id="modalClose" class="btn-icon">×</button>
            </div>
            <div class="modal-body">
                <p id="modalMessage"></p>
                <div id="modalCustomContent"></div>
            </div>
            <div id="modalTestingBar" class="modal-testing-bar" hidden>
                <div class="bar-label">Iterative Testing</div>
                <div class="bar-buttons">
                    <button id="modalUndo" class="btn btn-sm btn-secondary">Undo</button>
                    <button id="modalRedo" class="btn btn-sm btn-secondary">Redo</button>
                    <button id="modalRun" class="btn btn-sm btn-primary">▶ Run Current</button>
                </div>
            </div>
            <div class="modal-footer">
                <button id="modalCancel" class="btn btn-secondary">Cancel</button>
                <button id="modalConfirm" class="btn btn-primary">OK</button>
            </div>
        </div>
    </div>

    <!-- New Command Modal Template Content -->
    <template id="newCommandTemplate">
        <div class="new-command-form">
            <div class="selection-grid">
                <div class="form-group">
                    <label for="categorySelect">Step 1: Category</label>
                    <select id="categorySelect" class="form-select">
                        <option value="" disabled selected>Select category...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="toolSelect">Step 2: Tool</label>
                    <select id="toolSelect" class="form-select" disabled>
                        <option value="" disabled selected>Select category first...</option>
                    </select>
                </div>
            </div>
            <div id="toolArgsForm" class="tool-args-form">
                <!-- Dynamic arguments will be injected here -->
            </div>
        </div>
    </template>

    <script src="globals.js"></script>
    <script src="modal.js"></script>
    <script src="api.js"></script>
    <script src="ui.js"></script>
    <script src="playback.js"></script>
    <script src="commands.js"></script>
    <script src="app.js"></script>
</body>

</html>
